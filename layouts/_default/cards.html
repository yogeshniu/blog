{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<div class="post-description">{{ . }}</div>{{ end }}
</header>
<div class="topic-grid">
  {{- range .Sections.ByTitle }}
  <a class="topic-card" href="{{ .RelPermalink }}">
    <span class="topic-card__title">{{ .Title }}</span>
    {{- with .Description }}<span class="topic-card__desc">{{ . }}</span>{{ end }}
    <span class="topic-card__meta">{{ len .RegularPagesRecursive }} notes <i aria-hidden="true">&rarr;</i></span>
  </a>
  {{- end }}
</div>
{{- end }}
