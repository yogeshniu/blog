{{- range . }}
<a class="topic-card tool-card" href="{{ .RelPermalink }}">
  <span class="tool-card__icon" aria-hidden="true">{{ .Params.icon }}</span>
  <span class="topic-card__title">{{ .Title }}</span>
  <span class="topic-card__desc">{{ .Description }}</span>
  <span class="topic-card__meta">Open <i aria-hidden="true">&rarr;</i></span>
</a>
{{- end }}
