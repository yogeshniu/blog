{{- /* Load KaTeX only on pages with  katex = true  (or  math = true)  in their front matter */ -}}
{{- if or .Params.katex .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css"
    integrity="sha384-vKruj+a13U8yHIkAyGgK1J3ArTLzrFGBbBc0tDp4ad/EyewESeXE/Iv67Aj8gKZ0" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"
    integrity="sha384-PwRUT/YqbnEjkZO0zZxNqcxACrXe+j766U2amXcgMg5457rve2Y7I6ZJSm2A0mS4"
    crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    });"></script>
{{- end }}
{{- if .IsHome }}
{{- $cv := site.Data.cv }}
<script type="application/ld+json">
{{ dict "@context" "https://schema.org" "@type" "Person" "name" $cv.name "url" site.Home.Permalink "jobTitle" (index $cv.experience 0).title "worksFor" (dict "@type" "Organization" "name" (index $cv.experience 0).org) "alumniOf" (dict "@type" "CollegeOrUniversity" "name" (index $cv.education 0).org) "email" $cv.email "address" (dict "@type" "PostalAddress" "addressLocality" "Lalitpur" "addressCountry" "NP") "sameAs" (slice $cv.linkedin "https://x.com/yogesh__sn" "https://www.youtube.com/@palpasky6909" "https://www.instagram.com/livingonnature") | jsonify (dict "noHTMLEscape" true) | safeJS }}
</script>
{{- end }}
