baseURL = "https://yogeshsn.com.np/"
languageCode = "en-us"
title = "Yogesh SN"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 12

# RSS and the search index are only generated for the home page; every other page is plain HTML.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# "Keep reading" suggestions at the end of each article
[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.highlight]
    noClasses = false

# ---------- Menu ----------
[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "references"
  name = "References"
  url = "/references/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 50

[[menu.main]]
  identifier = "archive"
  name = "Archive"
  url = "/archives/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 60

# ---------- Theme settings ----------
[params]
  env = "production"
  author = "Yogesh Sharma Neupane"
  description = "Civil and hydropower engineer working on reservoir optimization, climate-resilient infrastructure and computational modelling."
  defaultTheme = "auto"        # follows the visitor's light/dark setting
  mainSections = ["posts"]
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  ShowWordCount = false
  comments = true              # shows the "Keep reading" list (no comment box) at the end of articles
  images = ["og-image.png"]    # picture shown when a link is shared (WhatsApp, LinkedIn, ...)

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"

  [params.footer]
    text = "Dream, Discipline, and Dedication"

  # Home page: photo, short intro and buttons.
  # The image comes from assets/ys.webp
  [params.profileMode]
    enabled = true
    title = "Yogesh Sharma Neupane"
    subtitle = "Civil and hydropower engineer working on reservoir optimization, climate-resilient infrastructure and computational modelling.\n\n*Currently learning metaheuristic optimization and machine learning.*"
    imageUrl = "ys.webp"
    imageWidth = 250
    imageHeight = 250
    imageTitle = "Yogesh Sharma Neupane"

    [[params.profileMode.buttons]]
      name = "About me"
      url = "/about/"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/posts/"

    [[params.profileMode.buttons]]
      name = "References"
      url = "/references/"

